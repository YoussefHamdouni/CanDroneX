# Livraison continue : publie l'image de l'application dans le GitHub Container Registry.
#
# Déclenchée par une étiquette Git (ex. `git tag phase1 && git push origin phase1`).
# Elle relance d'abord toute la CI : une image n'est jamais publiée si un test échoue.
# L'image est construite pour amd64 et arm64 (Mac à puce Apple).
#
# Résultat : ghcr.io/<compte>/candronex:<étiquette>  (ex. :phase1), et :<sha court>.

name: CD

on:
  push:
    tags: ["phase*", "v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Tests (CI)
    uses: ./.github/workflows/ci.yml

  publier-image:
    name: Publier l'image
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/candronex
          tags: |
            type=ref,event=tag
            type=sha,prefix=

      - name: Construire et publier (amd64 et arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}