# Intégration continue : vérifie chaque changement, sans rien publier.
#
# 1. tests-rapides : tests unitaires, règles d'architecture et contrats import-linter,
#    sans base de données. Retour en moins d'une minute.
# 2. tests-conteneur : démarre l'environnement avec docker compose, comme sur un poste,
#    puis lance toute la suite de tests DANS le conteneur app (intégration et bout en bout).
#
# Ce workflow est aussi appelé par cd.yml avant toute publication.

name: CI

on:
  push:
    branches: ["**"]   # toutes les branches; les étiquettes (tags) sont traitées par cd.yml
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests-rapides:
    name: Tests unitaires et architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer le projet et les dépendances de test
        run: pip install -e ".[dev]"

      - name: Tests unitaires et règles d'architecture
        run: pytest tests/unit tests/architecture -v

      - name: Contrats import-linter
        run: lint-imports --no-cache

  tests-conteneur:
    name: Tests dans le conteneur (intégration et bout en bout)
    runs-on: ubuntu-latest
    needs: tests-rapides
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la configuration
        run: |
          cp .env.example .env
          # Simulation plus rapide pour le test de bout en bout.
          sed -i 's/^SIMULATION_DELAY_SECONDS=.*/SIMULATION_DELAY_SECONDS=1/' .env

      - name: Construire et démarrer l'environnement
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Vérifier le point de santé
        run: curl --fail --silent http://localhost:8000/health

      - name: Lancer toute la suite de tests dans le conteneur app
        run: docker compose exec -T app pytest -v

      - name: Contrats import-linter dans le conteneur
        run: docker compose exec -T app lint-imports

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Arrêter l'environnement
        if: always()
        run: docker compose down -v