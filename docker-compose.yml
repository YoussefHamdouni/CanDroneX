services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - candronex-pgdata:/var/lib/postgresql/data
    networks: [candronex-net]
    # Port 5432 volontairement non publié : seule l'application accède à la base.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [candronex-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    restart: unless-stopped

networks:
  candronex-net:

volumes:
  candronex-pgdata:
